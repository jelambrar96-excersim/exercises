name: Auto-merge Exercism Solutions PRs

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only run if the PR is targeting main AND the actor is jelambrar96 or exercism-solutions-syncer
    if: github.base_ref == 'main' && (github.actor == 'jelambrar96' || github.actor == 'exercism-solutions-syncer[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Use official gh CLI to enable auto-merge and merge PR
      - name: Enable auto-merge
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --admin --repo jelambrar96-excersim/exercises
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
